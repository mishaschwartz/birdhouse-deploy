name: birdhouse
services:
  alertmanager:
    restart: always
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --log.level=debug
      - --web.external-url=http://host.docker.internal/alertmanager
    image: prom/alertmanager:v0.21.0
    networks:
      default: null
    volumes:
      - type: bind
        source: ./components/monitoring/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/monitoring/alertmanager.tmpl
        target: /etc/alertmanager/template/default.tmpl
        read_only: true
        bind: {}
      - type: volume
        source: alertmanager_persistence
        target: /alertmanager
        volume: {}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:9093
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  cadvisor:
    restart: always
    container_name: cadvisor
    devices:
      - source: /dev/kmsg
        target: /dev/kmsg
        permissions: rwm
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    networks:
      default: null
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
        bind: {}
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
        bind: {}
      - type: bind
        source: /sys
        target: /sys
        read_only: true
        bind: {}
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
        bind: {}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:8080
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  canarie-api:
    restart: always
    container_name: canarie-api
    entrypoint:
      - /entrypoint
    environment:
      CANARIE_API_CONFIG_FN: /config/docker_configuration.py
      CANARIE_MONITORING_EXTRA_CONF_DIR: /conf.d
    image: pavics/canarieapi:1.2.1
    networks:
      default: null
    volumes:
      - type: volume
        source: canarie-data
        target: /data
        volume: {}
      - type: bind
        source: ./components/canarie-api/docker_configuration.py
        target: /config/docker_configuration.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/canarie-api/entrypoint
        target: /entrypoint
        read_only: true
        bind: {}
      - type: bind
        source: ./components/magpie/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/magpie_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/twitcher/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/twitcher_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/wps_outputs-volume/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/wps_outputs-volume_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/cowbird/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/0_cowbird_config.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/stac/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/stac_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/geoserver/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/geoserver_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/hummingbird/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/hummingbird_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/thredds/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/thredds_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/jupyterhub/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/jupyterhub_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/finch/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/finch_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/0_weaver_config.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/weaver_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/raven/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/raven_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/testthredds/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/testthredds_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/generic_bird/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/generic_bird_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/canarie-api/a_demo_override_precedence.py
        target: /conf.d/a_demo_override_precedence.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/canarie-api/z_demo_only_py_file_are_loaded.wrongsuffix
        target: /conf.d/z_demo_only_py_file_are_loaded.wrongsuffix
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/cowbird/canarie_api_full_monitoring.py
        target: /conf.d/cowbird_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/finch/canarie_api_full_monitoring.py
        target: /conf.d/finch_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/hummingbird/canarie_api_full_monitoring.py
        target: /conf.d/hummingbird_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/raven/canarie_api_full_monitoring.py
        target: /conf.d/raven_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/thredds/canarie_api_full_monitoring.py
        target: /conf.d/thredds_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/weaver/canarie_api_full_monitoring.py
        target: /conf.d/weaver_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/emu/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/emu_canarie_api_monitoring.py
        read_only: true
        bind: {}
    depends_on:
      proxy:
        condition: service_started
        restart: true
        required: true
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:2000
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  canarie-api-cron:
    restart: always
    container_name: canarie-api-cron
    entrypoint:
      - /entrypoint
    environment:
      CANARIE_API_CONFIG_FN: /config/docker_configuration.py
      CANARIE_MONITORING_EXTRA_CONF_DIR: /conf.d
    image: pavics/canarieapi:1.2.1
    networks:
      default: null
    volumes:
      - type: volume
        source: canarie-data
        target: /data
        volume: {}
      - type: bind
        source: ./components/canarie-api/docker_configuration.py
        target: /config/docker_configuration.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/canarie-api/entrypoint-cron
        target: /entrypoint
        read_only: true
        bind: {}
      - type: volume
        source: proxy-logs
        target: /logs
        read_only: true
        volume: {}
      - type: bind
        source: ./components/magpie/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/magpie_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/twitcher/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/twitcher_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/wps_outputs-volume/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/wps_outputs-volume_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/cowbird/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/0_cowbird_config.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/stac/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/stac_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/geoserver/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/geoserver_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/hummingbird/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/hummingbird_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/thredds/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/thredds_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/jupyterhub/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/jupyterhub_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/finch/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/finch_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/0_weaver_config.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/weaver_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/raven/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/raven_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/testthredds/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/testthredds_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/generic_bird/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/generic_bird_canarie_api_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/canarie-api/a_demo_override_precedence.py
        target: /conf.d/a_demo_override_precedence.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/canarie-api/z_demo_only_py_file_are_loaded.wrongsuffix
        target: /conf.d/z_demo_only_py_file_are_loaded.wrongsuffix
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/cowbird/canarie_api_full_monitoring.py
        target: /conf.d/cowbird_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/finch/canarie_api_full_monitoring.py
        target: /conf.d/finch_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/hummingbird/canarie_api_full_monitoring.py
        target: /conf.d/hummingbird_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/raven/canarie_api_full_monitoring.py
        target: /conf.d/raven_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/thredds/canarie_api_full_monitoring.py
        target: /conf.d/thredds_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/canarie-api-full-monitoring/config/weaver/canarie_api_full_monitoring.py
        target: /conf.d/weaver_canarie_api_full_monitoring.py
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/emu/config/canarie-api/canarie_api_monitoring.py
        target: /conf.d/emu_canarie_api_monitoring.py
        read_only: true
        bind: {}
    depends_on:
      canarie-api:
        condition: service_started
        required: true
  cowbird:
    restart: always
    container_name: cowbird
    links:
      - cowbird-mongodb
    environment:
      COWBIRD_CONFIG_PATH: /opt/local/src/cowbird/config/cowbird.yml
      COWBIRD_FILESYSTEM_ADMIN_GID: "0"
      COWBIRD_FILESYSTEM_ADMIN_UID: "0"
      COWBIRD_FILESYSTEM_USER_GID: "1000"
      COWBIRD_FILESYSTEM_USER_UID: "1000"
      COWBIRD_INI_FILE_PATH: /opt/local/src/cowbird/config/cowbird.ini
      COWBIRD_SSL_VERIFY: "true"
      FORWARDED_ALLOW_IPS: '*'
      GEOSERVER_ADMIN_PASSWORD: geoserverpass
      GEOSERVER_ADMIN_USER: admingeo
      HOSTNAME: host.docker.internal
      JUPYTERHUB_USER_DATA_DIR: ./birdhouse/data/jupyterhub_user_data
      PUBLIC_WORKSPACE_WPS_OUTPUTS_SUBDIR: public/wps_outputs
      SECURE_DATA_PROXY_NAME: secure-data-proxy
      WORKSPACE_DIR: ./birdhouse/data/user_workspaces
      WPS_OUTPUTS_DIR: ./birdhouse/data/wps_outputs
    image: pavics/cowbird:2.7.1-webservice
    networks:
      cowbird-mongodb: null
      default: null
    volumes:
      - type: bind
        source: ./components/cowbird/config/cowbird/config.yml
        target: /opt/local/src/cowbird/config/cowbird.yml
        bind: {}
      - type: bind
        source: ./components/cowbird/config/cowbird/cowbird.ini
        target: /opt/local/src/cowbird/config/cowbird.ini
        bind: {}
      - type: bind
        source: ./components/cowbird/config/cowbird/celeryconfig.py
        target: /opt/local/src/cowbird/config/celeryconfig.py
        bind: {}
      - type: bind
        source: ./birdhouse/data
        target: ./birdhouse/data
        bind: {}
      - type: bind
        source: ./birdhouse/data/jupyterhub_user_data
        target: ./birdhouse/data/jupyterhub_user_data
        bind: {}
    depends_on:
      cowbird-mongodb:
        condition: service_started
        required: true
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://0.0.0.0:7000
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  cowbird-mongodb:
    restart: always
    container_name: cowbird-mongodb
    image: mongo:5.0
    networks:
      cowbird-mongodb: null
    volumes:
      - type: bind
        source: ./birdhouse/data/mongodb_cowbird_persist
        target: /data/db
        bind: {}
    healthcheck:
      test:
        - CMD
        - mongo
        - --eval
        - print('connected')
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  cowbird-worker:
    restart: always
    container_name: cowbird-worker
    links:
      - cowbird-mongodb
    environment:
      COWBIRD_CONFIG_PATH: /opt/local/src/cowbird/config/cowbird.yml
      COWBIRD_FILESYSTEM_ADMIN_GID: "0"
      COWBIRD_FILESYSTEM_ADMIN_UID: "0"
      COWBIRD_FILESYSTEM_USER_GID: "1000"
      COWBIRD_FILESYSTEM_USER_UID: "1000"
      COWBIRD_INI_FILE_PATH: /opt/local/src/cowbird/config/cowbird.ini
      COWBIRD_SSL_VERIFY: "true"
      GEOSERVER_ADMIN_PASSWORD: geoserverpass
      GEOSERVER_ADMIN_USER: admingeo
      JUPYTERHUB_USER_DATA_DIR: ./birdhouse/data/jupyterhub_user_data
      MAGPIE_POSTGRES_DB: magpiedb
      MAGPIE_POSTGRES_HOST: postgres-magpie
      MAGPIE_POSTGRES_PASSWORD: postgres-qwerty
      MAGPIE_POSTGRES_USER: postgres-magpie
      POSTGRES_DB: magpiedb
      POSTGRES_PASSWORD: postgres-qwerty
      POSTGRES_USER: postgres-magpie
      WORKSPACE_DIR: ./birdhouse/data/user_workspaces
    image: pavics/cowbird:2.7.1-worker
    networks:
      cowbird-mongodb: null
      default: null
    volumes:
      - type: bind
        source: ./components/cowbird/config/cowbird/config.yml
        target: /opt/local/src/cowbird/config/cowbird.yml
        bind: {}
      - type: bind
        source: ./components/cowbird/config/cowbird/cowbird.ini
        target: /opt/local/src/cowbird/config/cowbird.ini
        bind: {}
      - type: bind
        source: ./components/cowbird/config/cowbird/celeryconfig.py
        target: /opt/local/src/cowbird/config/celeryconfig.py
        bind: {}
      - type: bind
        source: ./birdhouse/data/user_workspaces
        target: ./birdhouse/data/user_workspaces
        bind: {}
      - type: bind
        source: ./birdhouse/data/jupyterhub_user_data
        target: ./birdhouse/data/jupyterhub_user_data
        bind: {}
    depends_on:
      cowbird:
        condition: service_started
        required: true
      cowbird-mongodb:
        condition: service_started
        required: true
  dggs:
    restart: always
    container_name: dggs
    environment:
      API_CONTACT: |

        {
            "name": "Contact API Maintainer",
            "url": "https://crim.ca/",
            "email": "francis.charette-migneault@crim.ca"
        }
      API_DESCRIPTION: PyDGGSAPI implementation of Discrete Global Grid System references
        and data retrieval.
      API_TITLE: Birdhouse - Discrete Global Grid System API
      DGGS_PREFIX: /dggs-api
      DOCS_URL: /dggs-api/docs
      FORWARDED_ALLOW_IPS: '*'
      HOSTNAME: host.docker.internal
      HTTP_HOST: host.docker.internal
      OPENAPI_URL: /dggs-api/api
      PYDGGSAPI_LOG_LEVEL: info
      PYDGGSAPI_PORT: "8000"
      PYDGGSAPI_WORKERS: "8"
      SERVICE_META_URL: http://host.docker.internal/services/dggs
      TILES_PREFIX: /tiles-api
    image: ghcr.io/crim-ca/pydggsapi:0.1.6-rc12
    networks:
      default: null
    volumes:
      - type: bind
        source: ./optional-components/dggs-data-sample/config/dggs-data-sample/pydggsapi-config.json
        target: /opt/local/src/pydggsapi/config/pydggsapi-config.json
        bind: {}
      - type: bind
        source: ./birdhouse/data/dggs
        target: /data/dggs
        bind: {}
      - type: bind
        source: ./optional-components/dggs-data-sample/config/dggs-data-sample/data/
        target: /data/samples
        read_only: true
        bind: {}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/dggs-api/')
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  docker-proxy:
    container_name: docker-proxy
    environment:
      CONTAINERS: "1"
      EXEC: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "0"
      NODES: "0"
      POST: "1"
      SERVICES: "0"
      TASKS: "0"
      VOLUMES: "1"
    image: tecnativa/docker-socket-proxy:0.1.1
    networks:
      docker-proxy: null
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind: {}
  emu:
    restart: always
    container_name: emu
    environment:
      PYWPS_CFG: /wps.cfg
    image: tlvu/emu:watchdog
    networks:
      default: null
    volumes:
      - type: bind
        source: ./optional-components/emu/wps.cfg
        target: /wps.cfg
        bind: {}
      - type: volume
        source: wps_outputs
        target: /data/wpsoutputs
        volume: {}
      - type: volume
        target: /tmp
        volume: {}
  finch:
    restart: always
    container_name: finch
    environment:
      HOSTNAME: host.docker.internal
      HTTP_PORT: "5000"
      PYWPS_CFG: /wps.cfg
    image: birdhouse/finch:version-0.14.0
    networks:
      default: null
    volumes:
      - type: bind
        source: ./components/finch/wps.cfg
        target: /wps.cfg
        bind: {}
      - type: volume
        target: /tmp
        volume: {}
      - type: volume
        source: wps_outputs
        target: /data/wpsoutputs
        volume: {}
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:5000?service=WPS&request=GetCapabilities
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  generic_bird:
    restart: always
    container_name: generic_bird
    links:
      - postgres_generic_bird
    environment:
      PYWPS_CFG: /wps.cfg
    image: birdhouse/finch:version-0.14.0
    networks:
      default: null
    volumes:
      - type: bind
        source: ./optional-components/generic_bird/wps.cfg
        target: /wps.cfg
        read_only: true
        bind: {}
      - type: volume
        target: /tmp
        volume: {}
      - type: volume
        source: wps_outputs
