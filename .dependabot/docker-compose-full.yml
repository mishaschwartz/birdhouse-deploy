      STAC_HOST: http://stac:8000/stac
    image: ghcr.io/crim-ca/stac-populator:0.0.0
    networks:
      default: null
    depends_on:
      stac:
        condition: service_started
        required: true
  test-cowbird-jupyter-access:
    restart: 'no'
    container_name: test-cowbird-jupyter-access
    command:
      - python
      - /test_cowbird_jupyter.py
    environment:
      BIRDHOUSE_HOST_URL: http://host.docker.internal
      MAGPIE_ADMIN_PASSWORD: qwertyqwerty!
      MAGPIE_ADMIN_USERNAME: admin
      TEST_COWBIRD_JUPYTERHUB_PASSWORD: qwertyqwerty
      TEST_COWBIRD_JUPYTERHUB_USERNAME: testcowbirdjupyter
      WORKSPACE_DIR: ./birdhouse/data/user_workspaces
      WPS_OUTPUTS_DIR: ./birdhouse/data/wps_outputs
    image: pavics/workflow-tests:py312-260415
    networks:
      default: null
    user: root:root
    volumes:
      - type: bind
        source: ./birdhouse/optional-components/test-cowbird-jupyter-access/test_cowbird_jupyter.py
        target: /test_cowbird_jupyter.py
        bind: {}
      - type: bind
        source: ./optional-components/test-geoserver-secured-access/test-data
        target: /geoserver-test-data
        read_only: true
        bind: {}
      - type: bind
        source: ./birdhouse/data
        target: ./birdhouse/data
        bind: {}
    depends_on:
      cowbird:
        condition: service_started
        required: true
      magpie:
        condition: service_started
        required: true
  testthredds:
    restart: always
    container_name: testthredds
    entrypoint:
      - /entrypointwrapper
    environment:
      BIRDHOUSE_FQDN_PUBLIC: host.docker.internal
      TDM_PW: CHANGEME!
      TDM_XMS_SIZE: 1G
      TDM_XMX_SIZE: 12G
      TDS_CONTENT_ROOT_PATH: /usr/local/tomcat/content
      TDS_HOST: http://thredds.yourhost.net/
      THREDDS_XMS_SIZE: 1G
      THREDDS_XMX_SIZE: 20G
      TOMCAT_GROUP_ID: "1000"
      TOMCAT_USER_ID: "1000"
      WANTED_CONTEXT_ROOT: testthredds
      WANTED_CONTEXT_ROOT_WARFILE_NAME: testthredds
    image: pavics/thredds-docker:5.5-unidata-2024-11-19-with-tds-plugin-jar-with-dependencies.jar
    networks:
      default: null
    volumes:
      - type: volume
        source: testthredds_persistence
        target: /usr/local/tomcat/content/thredds
        volume: {}
      - type: bind
        source: ./birdhouse/data/testdatasets
        target: /birdhouse-testdata
        read_only: true
        bind: {}
      - type: bind
        source: ./birdhouse/data/datasets
        target: /birdhouse-data
        read_only: true
        bind: {}
      - type: bind
        source: ./birdhouse/data/ncml
        target: /birdhouse-ncml
        read_only: true
        bind: {}
      - type: volume
        source: testwps_outputs
        target: /testwps_outputs
        read_only: true
        volume: {}
      - type: volume
        source: wps_outputs
        target: /birdhouse-data/wps_outputs
        read_only: true
        volume: {}
      - type: bind
        source: ./optional-components/testthredds/catalog.xml
        target: /usr/local/tomcat/content/thredds/catalog.xml
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/testthredds/threddsConfig.xml
        target: /usr/local/tomcat/content/thredds/threddsConfig.xml
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/testthredds/wmsConfig.xml
        target: /usr/local/tomcat/content/thredds/wmsConfig.xml
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/testthredds/entrypointwrapper
        target: /entrypointwrapper
        read_only: true
        bind: {}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/testthredds/catalog.html
  thanos-compactor:
    restart: always
    container_name: thanos-compactor
    command:
      - compact
      - --data-dir=/tmp/data
      - --wait
      - --wait-interval=48h
      - |
        --objstore.config=type: S3
        config:
          bucket: thanos-bucket
          access_key: minioadmin
          secret_key: minioadmin
          endpoint: thanos-minio:9000
          insecure: true # use http instead of https
    image: thanosio/thanos:v0.35.1
    networks:
      default: null
    depends_on:
      thanos-minio:
        condition: service_started
        required: true
  thanos-minio:
    restart: always
    container_name: thanos-minio
    command:
      - minio
      - server
      - --console-address
      - :9001
      - /data
    entrypoint:
      - /entrypoint
    environment:
      MINIO_BROWSER_REDIRECT_URL: https://host.docker.internal/thanos-minio
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
      THANOS_MINIO_BUCKET_NAME: thanos-bucket
    image: minio/minio:RELEASE.2024-05-27T19-17-46Z
    networks:
      default: null
    volumes:
      - type: bind
        source: ./birdhouse/data/thanos_minio_data/
        target: /data
        bind: {}
      - type: bind
        source: ./optional-components/thanos/minio-entrypoint
        target: /entrypoint
        bind: {}
  thanos-query:
    restart: always
    container_name: thanos-query
    command:
      - query
      - --http-address=0.0.0.0:19192
      - --web.route-prefix=/thanos-query
      - --web.external-prefix=/thanos-query
      - --endpoint=thanos-sidecar:19090
    image: thanosio/thanos:v0.35.1
    networks:
      default: null
    depends_on:
      thanos-sidecar:
        condition: service_started
        required: true
  thanos-sidecar:
    restart: always
    container_name: thanos-sidecar
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus-longterm-metrics:9090/prometheus-longterm-metrics
      - --grpc-address=0.0.0.0:19090
      - --http-address=0.0.0.0:19191
      - |
        --objstore.config=type: S3
        config:
          bucket: thanos-bucket
          access_key: minioadmin
          secret_key: minioadmin
          endpoint: thanos-minio:9000
          insecure: true # use http instead of https
    image: thanosio/thanos:v0.35.1
    networks:
      default: null
    user: nobody
    volumes:
      - type: volume
        source: prometheus_longterm_persistence
        target: /prometheus
        volume: {}
    depends_on:
      prometheus-longterm-metrics:
        condition: service_started
        required: true
      thanos-minio:
        condition: service_started
        required: true
  thredds:
    restart: always
    container_name: thredds
    entrypoint:
      - /entrypointwrapper
    environment:
      BIRDHOUSE_FQDN_PUBLIC: host.docker.internal
      TDM_PW: CHANGEME!
      TDM_XMS_SIZE: 1G
      TDM_XMX_SIZE: 12G
      TDS_CONTENT_ROOT_PATH: /usr/local/tomcat/content
      TDS_HOST: http://thredds.yourhost.net/
      THREDDS_XMS_SIZE: 1G
      THREDDS_XMX_SIZE: 20G
      TOMCAT_GROUP_ID: "1000"
      TOMCAT_USER_ID: "1000"
    image: pavics/thredds-docker:5.5-unidata-2024-11-19-with-tds-plugin-jar-with-dependencies.jar
    networks:
      default: null
    volumes:
      - type: volume
        source: thredds_persistence
        target: /usr/local/tomcat/content/thredds
        volume: {}
      - type: bind
        source: ./birdhouse/data/datasets
        target: /birdhouse-data
        bind: {}
      - type: bind
        source: ./birdhouse/data/ncml
        target: /birdhouse-ncml
        bind: {}
      - type: volume
        source: wps_outputs
        target: /birdhouse-data/wps_outputs
        volume: {}
      - type: bind
        source: ./components/thredds/catalog.xml
        target: /usr/local/tomcat/content/thredds/catalog.xml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/thredds/threddsConfig.xml
        target: /usr/local/tomcat/content/thredds/threddsConfig.xml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/thredds/wmsConfig.xml
        target: /usr/local/tomcat/content/thredds/wmsConfig.xml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/thredds/entrypointwrapper
        target: /entrypointwrapper
        read_only: true
        bind: {}
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - http://localhost:8080/thredds/catalog.html
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  twitcher:
    restart: always
    container_name: twitcher
    links:
      - postgres-magpie
    command:
      - pserve
      - /opt/birdhouse/src/twitcher/twitcher.ini
    environment:
      MAGPIE_POSTGRES_DB: magpiedb
      MAGPIE_POSTGRES_HOST: postgres-magpie
      MAGPIE_POSTGRES_PASSWORD: postgres-qwerty
      MAGPIE_POSTGRES_USER: postgres-magpie
      MAGPIE_PROVIDERS_CONFIG_PATH: /opt/birdhouse/src/magpie/config
      POSTGRES_DB: magpiedb
      POSTGRES_PASSWORD: postgres-qwerty
      POSTGRES_USER: postgres-magpie
    image: pavics/twitcher:magpie-5.1.2
    networks:
      default: null
    volumes:
      - type: bind
        source: ./components/twitcher/twitcher.ini
        target: /opt/birdhouse/src/twitcher/twitcher.ini
        bind: {}
      - type: bind
        source: ./components/stac/config/magpie/config.yml
        target: /opt/birdhouse/src/magpie/config/stac-config.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/stac/config/magpie/stac_hooks.py
        target: /opt/birdhouse/src/magpie/hooks/stac_hooks.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/magpie/config.yml
        target: /opt/birdhouse/src/magpie/config/weaver-config.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/magpie/weaver_hooks.py
        target: /opt/birdhouse/src/magpie/hooks/weaver_hooks.py
        read_only: true
        bind: {}
      - type: bind
        source: ./components/dggs/config/magpie/config.yml
        target: /opt/birdhouse/src/magpie/config/dggs-config.yml
        read_only: true
        bind: {}
    depends_on:
      magpie:
        condition: service_started
        required: true
      postgres-magpie:
        condition: service_started
        required: true
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://0.0.0.0:8000
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  weaver:
    restart: always
    container_name: weaver
    links:
      - weaver-mongodb
    environment:
      FORWARDED_ALLOW_IPS: '*'
      HOSTNAME: host.docker.internal
      HTTP_HOST: host.docker.internal
      SCRIPT_NAME: /weaver
    image: pavics/weaver:6.16.0-manager
    networks:
      default: null
      weaver-mongodb: null
    volumes:
      - type: bind
        source: ./components/weaver/config/weaver/weaver.ini
        target: /opt/local/src/weaver/config/weaver.ini
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/weaver/data_sources.yml
        target: /opt/local/src/weaver/config/data_sources.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/test-weaver/config/weaver/request_options.yml
        target: /opt/local/src/weaver/config/request_options.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/weaver/wps_processes.yml
        target: /opt/local/src/weaver/config/wps_processes.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/celery-healthcheck
        target: /opt/local/bin/weaver/celery-healthcheck
        read_only: true
        bind: {}
      - type: bind
        source: ./birdhouse/data/wps_outputs/weaver
        target: ./birdhouse/data/wps_outputs/weaver
        bind: {}
    depends_on:
      weaver-mongodb:
        condition: service_started
        required: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4001/weaver/')
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  weaver-mongodb:
    restart: always
    container_name: weaver-mongodb
    image: mongo:5.0
    networks:
      weaver-mongodb: null
    volumes:
      - type: bind
        source: ./birdhouse/data/mongodb_weaver_persist
        target: /data/db
        bind: {}
    healthcheck:
      test:
        - CMD
        - mongo
        - --eval
        - print('connected')
      timeout: 5s
      interval: 1m0s
      retries: 3
      start_period: 30s
      start_interval: 5s
  weaver-worker:
    restart: always
    container_name: weaver-worker
    links:
      - weaver-mongodb
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    image: pavics/weaver:6.16.0-worker
    networks:
      docker-proxy: null
      weaver-mongodb: null
    volumes:
      - type: bind
        source: ./components/weaver/config/weaver/weaver.ini
        target: /opt/local/src/weaver/config/weaver.ini
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/config/weaver/data_sources.yml
        target: /opt/local/src/weaver/config/data_sources.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./optional-components/test-weaver/config/weaver/request_options.yml
        target: /opt/local/src/weaver/config/request_options.yml
        read_only: true
        bind: {}
      - type: bind
        source: ./components/weaver/celery-healthcheck
        target: /opt/local/bin/weaver/celery-healthcheck
        read_only: true
        bind: {}
      - type: bind
        source: /tmp/wps_workdir/weaver
        target: /tmp/wps_workdir/weaver
        bind: {}
      - type: bind
        source: ./birdhouse/data/wps_outputs/weaver
        target: ./birdhouse/data/wps_outputs/weaver
        bind: {}
    depends_on:
      docker-proxy:
        condition: service_started
        required: true
      weaver:
        condition: service_started
        required: true
      weaver-mongodb:
        condition: service_started
        required: true
    healthcheck:
      test:
        - CMD
        - bash
        - /opt/local/bin/weaver/celery-healthcheck
      timeout: 20s
      interval: 1m0s
      retries: 2
      start_period: 30s
      start_interval: 5s
networks:
  cowbird-mongodb:
    name: birdhouse_cowbird-mongodb
  default:
    name: birdhouse_default
  docker-proxy:
    name: birdhouse_docker-proxy
    driver: bridge
  jupyterhub_network:
    name: jupyterhub_network
    external: true
  mongodb:
    name: birdhouse_mongodb
  weaver-mongodb:
    name: birdhouse_weaver-mongodb
volumes:
  alertmanager_persistence:
    name: alertmanager_persistence
    external: true
  canarie-data:
    name: birdhouse_canarie-data
  data:
    name: birdhouse_data
  grafana_persistence:
    name: grafana_persistence
    external: true
  jupyterhub_data_persistence:
    name: jupyterhub_data_persistence
    external: true
  nvidia_mps:
    name: birdhouse_nvidia_mps
    driver: local
    driver_opts:
      device: tmpfs
      type: tmpfs
  postgres_generic_bird:
    name: birdhouse_postgres_generic_bird
  prometheus_longterm_persistence:
    name: prometheus_longterm_persistence
    external: true
  prometheus_persistence:
    name: prometheus_persistence
    external: true
  proxy-logs:
    name: birdhouse_proxy-logs
  stac-db:
    name: birdhouse_stac-db
    driver: local
    driver_opts:
      device: ./birdhouse/data/stac-db_persist
      o: bind
      type: none
  testthredds_persistence:
    name: birdhouse_testthredds_persistence
  testwps_outputs:
    name: birdhouse_testwps_outputs
  thredds_persistence:
    name: thredds_persistence
    external: true
  wps_outputs:
    name: birdhouse_wps_outputs
x-objstore-config: |
  --objstore.config=type: S3
  config:
    bucket: thanos-bucket
    access_key: minioadmin
    secret_key: minioadmin
    endpoint: thanos-minio:9000
    insecure: true # use http instead of https
