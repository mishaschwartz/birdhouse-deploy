version: 2

updates:
  - package-ecosystem: docker-compose
    directories:
      - /.dependabot
    labels:
      - "ci/docker"
    commit-message:
      include: scope
      # Skip comment specifically for Jenkins CI builds on CRIM infrastructure
      # [skip ci] cannot be used here in order for auto-accept-ci-changes.yml to function
      prefix: "[skip jenkins] "
    schedule:
      interval: "quarterly"
