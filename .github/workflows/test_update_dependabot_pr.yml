name: Dependabot update docker PRs

on: 
  pull_request_target:
    types: [opened, reopened] # TODO: remove reopened

permissions:
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          allow-unsafe-pr-checkout: true
          ref: ${{ github.head_ref }}

      - name: Update relevant file
        run: |
          UPDATE_LOC="$(grep '^export.*_DOCKER=['\''\"]\{0,1\}${{ steps.dependabot-metadata.outputs.dependency-names }}' birdhouse/components/*/default.env birdhouse/optional-components/*/default.env | head -1)"
          FILE="${UPDATE_LOC%:*}"
          VAR_DEFINITION="${UPDATE_LOC##*:export }"
          VAR_PREFIX="${VAR_DEFINITION%_DOCKER=*}"
          sed -i "s/^\(export ${VAR_PREFIX}_VERSION=['\''\"]\{0,1\}\)${{ steps.dependabot-metadata.outputs.previous-version }}\(['\''\"]\{0,1\}\)/\1${{ steps.dependabot-metadata.outputs.new-version }}\2/" $FILE
          git diff
          git status
          echo ${{ steps.dependabot-metadata.outputs.dependency-names }}
          echo ${{ steps.dependabot-metadata.outputs.previous-version }}
          echo ${{ steps.dependabot-metadata.outputs.new-version }}
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
