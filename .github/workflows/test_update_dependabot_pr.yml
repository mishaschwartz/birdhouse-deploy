name: Dependabot update docker PRs

on: 
  pull_request:
    types: [opened, reopened] # TODO: remove reopened

permissions:
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update relevant file
        run: |
          set -x
          # Determine which service was updated by the dependabot PR
          UPDATED_SERVICE="$(git diff origin/${{ github.base_ref }} HEAD --no-color -- .dependabot/ | grep '^-[[:space:]]' -B1 | head -1 | sed 's/^[[:space:]]*\([^:]\{1,\}\):/\1/')"
          # Determine which default.env file contains the environment variable that needs to be updated to reflect the version update
          UPDATED_FILE="$(git diff origin/${{ github.base_ref }} HEAD --name-only -- ./.dependabot/)"
          COMPOSE_FILE="$(echo ${UPDATED_FILE} | sed "s:.*/\(components\|optional-components\)/\([^/]*\)/docker-compose.yml:birdhouse/\1/\2/docker-compose-extra.yml:")"
          ENV_FILE="${COMPOSE_FILE%/*}/default.env"
          # Update the environment variable that contains the version information
          VARIABLE_PREFIX="$(tail -n+"$(grep -n "^[[:space:]]*${UPDATED_SERVICE}:[[:space:]]*$" "${COMPOSE_FILE}" | head -1 | cut -f1 -d:)" "$COMPOSE_FILE" | grep 'image:' | head -1 | cut -d: -f 2- | sed 's/[[:space:]]*\${\(.*\)_IMAGE}/\1/')"
          sed -i "s/^\(export ${VARIABLE_PREFIX}_VERSION=['\''\"]\{0,1\}\)${{ steps.dependabot-metadata.outputs.previous-version }}\(['\''\"]\{0,1\}\)/\1${{ steps.dependabot-metadata.outputs.new-version }}\2/" "$ENV_FILE"
          # Describe the version update in the CHANGES.md file
          MESSAGE="update ${{ steps.dependabot-metadata.outputs.dependency-names }} from ${{ steps.dependabot-metadata.outputs.previous-version }} to ${{ steps.dependabot-metadata.outputs.new-version }}"
          CURRENT_VERSION="$(cut -d' ' -f1 RELEASE.txt | sed 's/\./\\./g')"
          sed -i "\:^\[Unreleased\]:,\:\[${CURRENT_VERSION}\]: s:^\[\/\/\].*\|^##\sChanges:## Changes\n\n- ${MESSAGE}:" CHANGES.md # if there is a [//] placeholder or ## Changes heading
          git diff --exit-code CHANGES.md > /dev/null || sed -i "\:\[${CURRENT_VERSION}\]:i ## Changes\n\n- ${MESSAGE}\n" CHANGES.md # otherwise add the changes to the end of the Unreleased section
          # Add and commit changes
          git add "$ENV_FILE" CHANGES.md
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "$MESSAGE"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
